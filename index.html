<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yinna's -小工具 智慧財務規劃與股市模擬器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        input[type=range] { accent-color: #10b981; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .modal-backdrop {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="h-full text-slate-200 antialiased flex flex-col font-sans bg-slate-950 selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 flex items-center justify-center font-black text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-white leading-tight flex items-center gap-2">
                        Yinna's 模擬器
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button id="reset-btn" class="px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors flex items-center gap-1.5 border border-slate-700 cursor-pointer">
                    <i class="fa-solid fa-rotate-left"></i> <span class="hidden sm:inline">重置資料</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Stat Dashboard Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div id="open-income-modal" class="glass-panel rounded-2xl p-4 shadow-xl cursor-pointer hover:border-emerald-500/50 transition-all group">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider group-hover:text-emerald-400">每月稅後總收入</span>
                <div class="mt-2"><span id="dash-income" class="text-xl font-black text-white">NT$ 0</span></div>
            </div>

            <div id="open-expense-modal" class="glass-panel rounded-2xl p-4 shadow-xl cursor-pointer hover:border-rose-500/50 transition-all group">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider group-hover:text-rose-400">固定必要支出</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="dash-expenses" class="text-xl font-black text-rose-400">NT$ 0</span>
                    <span id="ratio-expenses" class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20">0%</span>
                </div>
            </div>

            <div id="open-reserve-modal" class="glass-panel rounded-2xl p-4 shadow-xl cursor-pointer hover:border-amber-500/50 transition-all group">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider group-hover:text-amber-400">預備金撥入</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="dash-reserves" class="text-xl font-black text-amber-400">NT$ 0</span>
                    <span id="ratio-reserves" class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">0%</span>
                </div>
            </div>

            <div id="open-invest-modal" class="glass-panel rounded-2xl p-4 shadow-xl cursor-pointer hover:border-indigo-500/50 transition-all group">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider group-hover:text-indigo-400">長期儲蓄/投資</span>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="dash-invest" class="text-xl font-black text-indigo-400">NT$ 0</span>
                    <span id="ratio-invest" class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">0%</span>
                </div>
            </div>

            <div class="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-2xl p-4 shadow-xl text-white">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-emerald-100 uppercase tracking-wider">自由支配零用金</span>
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="dash-disposable" class="text-xl font-black text-white">NT$ 0</span>
                    <span id="ratio-disposable" class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-white/20 text-white">0%</span>
                </div>
            </div>
        </div>

        <!-- Allocation Chart Section -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-6 glass-panel rounded-2xl p-5 shadow-xl space-y-4">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-emerald-400"></i> 每月財務比例分布圖
                </h3>
                <div class="relative h-64 w-full flex items-center justify-center">
                    <canvas id="allocation-chart"></canvas>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-800">
                    <div class="flex justify-between items-center text-slate-300 bg-slate-900/50 p-2 rounded-xl">
                        <span>固定支出：</span><span id="chart-pct-expenses" class="font-bold">0%</span>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 bg-slate-900/50 p-2 rounded-xl">
                        <span>預備金：</span><span id="chart-pct-reserves" class="font-bold">0%</span>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 bg-slate-900/50 p-2 rounded-xl">
                        <span>長期投資：</span><span id="chart-pct-invest" class="font-bold">0%</span>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 bg-slate-900/50 p-2 rounded-xl">
                        <span>自由零用：</span><span id="chart-pct-disposable" class="font-bold">0%</span>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-6 glass-panel rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                    <h3 class="text-sm font-bold text-white flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-shield-halved text-teal-400"></i> 財務健康診斷報告
                    </h3>
                    <div id="health-check-content" class="text-xs leading-relaxed text-slate-300 bg-slate-900/60 p-4 rounded-xl border border-slate-800 space-y-2">
                        計算中...
                    </div>
                </div>
            </div>
        </div>

        <!-- Simulator Section -->
        <div class="glass-panel rounded-2xl p-6 shadow-xl space-y-6 border border-emerald-500/20">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div>
                    <h2 class="text-lg font-extrabold text-white flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-emerald-400"></i> 多標的投資組合與複利模擬器
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">後端 Express 代理安全連線，自動分析年化報酬率與資產成長</p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="sync-invest-btn" class="px-3 py-1.5 text-xs font-bold text-indigo-300 bg-indigo-500/20 hover:bg-indigo-500/30 rounded-lg border border-indigo-500/30 cursor-pointer">平均平分「長期儲蓄」</button>
                    <button id="sync-disposable-btn" class="px-3 py-1.5 text-xs font-bold text-emerald-300 bg-emerald-500/20 hover:bg-emerald-500/30 rounded-lg border border-emerald-500/30 cursor-pointer">平均平分「自由支配」</button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="bg-slate-900 p-5 rounded-2xl border border-emerald-500/30">
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="ai-ticker-input" value="00878" placeholder="輸入股票代號（例：0050, 00878, 2603, 2618, NVDA, QQQ）" class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm font-bold text-white focus:outline-none focus:border-emerald-500">
                    <button id="ai-analyze-btn" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs rounded-xl transition-all cursor-pointer">
                        <i class="fa-solid fa-plus"></i> 分析並加入組合
                    </button>
                </div>
            </div>

            <!-- Portfolio Rows -->
            <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <span class="text-xs font-bold text-slate-300">每月投資組合分配明細</span>
                    <span class="text-xs font-bold text-emerald-400">每月總投資額：<span id="total-portfolio-monthly" class="text-sm font-black text-white">NT$ 0</span></span>
                </div>
                <div id="portfolio-list-container" class="space-y-3"></div>
            </div>

            <!-- Slider -->
            <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800 space-y-2">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-slate-300">投資時間年限</label>
                    <span id="years-display" class="text-xs font-extrabold text-teal-400 bg-teal-500/10 border border-teal-500/30 px-2.5 py-0.5 rounded-full">20 年</span>
                </div>
                <input type="range" id="sim-years-slider" min="1" max="40" step="1" value="20" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer">
            </div>

            <!-- Stacked Bar Chart -->
            <div class="relative h-96 w-full pt-2">
                <canvas id="growth-chart"></canvas>
            </div>
        </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        const defaultData = {
            incomes: [{ id: 1, name: "主業薪資", amount: 50000 }],
            expenses: [{ id: 1, name: "固定支出", amount: 25000 }],
            reserves: [{ id: 1, name: "緊急預備金", amount: 5000 }],
            investment: 15000,
            simYears: 20,
            assets: [
                { ticker: "0050", name: "元大台灣50", monthlyAmount: 10000, cagr: 10.2, risk: "中風險" },
                { ticker: "00878", name: "國泰永續高股息", monthlyAmount: 5000, cagr: 8.5, risk: "中低風險" }
            ]
        };

        let state = JSON.parse(localStorage.getItem('yinna_budget_state_v8')) || JSON.parse(JSON.stringify(defaultData));
        let allocationChart = null;
        let growthChart = null;

        function saveState() { localStorage.setItem('yinna_budget_state_v8', JSON.stringify(state)); }
        function getTotalIncomes() { return state.incomes.reduce((s, i) => s + (Number(i.amount)||0), 0); }
        function getTotalExpenses() { return state.expenses.reduce((s, i) => s + (Number(i.amount)||0), 0); }
        function getTotalReserves() { return state.reserves.reduce((s, i) => s + (Number(i.amount)||0), 0); }
        function getTotalPortfolioMonthly() { return state.assets.reduce((s, i) => s + (Number(i.monthlyAmount)||0), 0); }
        function formatMoney(amount) { return 'NT$ ' + Number(amount).toLocaleString('zh-TW'); }

        function updateAllUI() {
            const inc = getTotalIncomes(), exp = getTotalExpenses(), res = getTotalReserves(), inv = Number(state.investment) || 0;
            const disp = inc - exp - res - inv;

            document.getElementById('dash-income').textContent = formatMoney(inc);
            document.getElementById('dash-expenses').textContent = formatMoney(exp);
            document.getElementById('dash-reserves').textContent = formatMoney(res);
            document.getElementById('dash-invest').textContent = formatMoney(inv);
            document.getElementById('dash-disposable').textContent = formatMoney(disp);

            updateDoughnutChart(exp, res, inv, Math.max(0, disp));
            renderPortfolioList();
            updateGrowthSimulation();
        }

        function updateDoughnutChart(exp, res, inv, disp) {
            const ctx = document.getElementById('allocation-chart').getContext('2d');
            let items = [
                { label: '固定支出', value: exp, color: '#f43f5e' },
                { label: '預備金', value: res, color: '#f59e0b' },
                { label: '長期投資', value: inv, color: '#6366f1' },
                { label: '自由零用', value: disp, color: '#34d399' }
            ].sort((a, b) => b.value - a.value);

            if (allocationChart) {
                allocationChart.data.labels = items.map(i => i.label);
                allocationChart.data.datasets[0].data = items.map(i => i.value);
                allocationChart.data.datasets[0].backgroundColor = items.map(i => i.color);
                allocationChart.update();
                return;
            }

            allocationChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: items.map(i => i.label),
                    datasets: [{ data: items.map(i => i.value), backgroundColor: items.map(i => i.color), borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
            });
        }

        function renderPortfolioList() {
            const container = document.getElementById('portfolio-list-container');
            container.innerHTML = '';

            if (state.assets.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs border border-dashed border-slate-800 rounded-xl">目前無任何標的，請在上方新增。</div>`;
                document.getElementById('total-portfolio-monthly').textContent = formatMoney(0);
                return;
            }

            state.assets.forEach((asset, index) => {
                const row = document.createElement('div');
                row.className = 'flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-950 p-3 rounded-xl border border-emerald-500/30';
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="font-black text-sm text-emerald-400 min-w-[60px]">${asset.ticker}</span>
                        <span class="text-xs text-slate-300 font-bold">${asset.name}</span>
                        <div class="relative group/cagr inline-block cursor-help">
                            <span class="text-[11px] font-bold text-teal-300 bg-teal-500/10 px-2 py-0.5 rounded-full border border-teal-500/20">CAGR: ${asset.cagr}% <i class="fa-solid fa-circle-info text-[9px]"></i></span>
                            <div class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 hidden group-hover/cagr:block w-60 p-2.5 bg-slate-900 border border-teal-500/40 rounded-xl text-[11px] text-slate-200 shadow-2xl z-20">
                                📊 <strong>CAGR（複合年均成長率）</strong> 代表預期年化報酬率（含複利）。
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="number" value="${asset.monthlyAmount || 0}" min="0" step="1000" class="asset-amount-input w-32 px-3 py-1 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-emerald-400" data-index="${index}">
                        <button class="remove-asset-btn text-slate-500 hover:text-rose-400 p-1 cursor-pointer" data-index="${index}"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('total-portfolio-monthly').textContent = formatMoney(getTotalPortfolioMonthly());

            document.querySelectorAll('.asset-amount-input').forEach(el => {
                el.addEventListener('input', (e) => {
                    state.assets[e.target.dataset.index].monthlyAmount = Number(e.target.value) || 0;
                    saveState();
                    document.getElementById('total-portfolio-monthly').textContent = formatMoney(getTotalPortfolioMonthly());
                    updateGrowthSimulation();
                });
            });

            document.querySelectorAll('.remove-asset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.assets.splice(Number(e.currentTarget.dataset.index), 1);
                    saveState();
                    renderPortfolioList();
                    updateGrowthSimulation();
                });
            });
        }

        function updateGrowthSimulation() {
            const years = Number(document.getElementById('sim-years-slider').value);
            document.getElementById('years-display').textContent = years + ' 年';
            state.simYears = years;
            saveState();

            let labels = Array.from({length: years}, (_, i) => (i + 1) + '年');
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];

            let datasets = state.assets.map((asset, idx) => {
                const monthly = Number(asset.monthlyAmount) || 0;
                const monthlyRate = ((asset.cagr || 10) / 100) / 12;
                let currentTotal = 0, dataPoints = [];

                for (let y = 1; y <= years; y++) {
                    for (let m = 1; m <= 12; m++) { currentTotal = (currentTotal + monthly) * (1 + monthlyRate); }
                    dataPoints.push(Math.round(currentTotal));
                }

                return {
                    label: `${asset.ticker} (${asset.cagr}%)`,
                    data: dataPoints,
                    backgroundColor: colors[idx % colors.length]
                };
            });

            const ctx = document.getElementById('growth-chart').getContext('2d');
            if (growthChart) {
                growthChart.data.labels = labels;
                growthChart.data.datasets = datasets;
                growthChart.update();
                return;
            }

            growthChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { stacked: true }, y: { stacked: true } }
                }
            });
        }

        // Call Backend API Endpoint
        document.getElementById('ai-analyze-btn').addEventListener('click', async () => {
            const ticker = document.getElementById('ai-ticker-input').value.trim();
            const btn = document.getElementById('ai-analyze-btn');
            if (!ticker) return;

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 後端分析中...`;
            btn.disabled = true;

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker })
                });

                if (res.ok) {
                    const data = await res.json();
                    const existing = state.assets.find(a => a.ticker.toUpperCase() === data.ticker.toUpperCase());
                    if (!existing) {
                        state.assets.push({
                            ticker: data.ticker,
                            name: data.name,
                            monthlyAmount: 5000,
                            cagr: data.cagr,
                            risk: data.risk
                        });
                        saveState();
                        renderPortfolioList();
                        updateGrowthSimulation();
                    }
                }
            } catch (err) {
                console.error("Fetch API Error:", err);
            }

            btn.innerHTML = `<i class="fa-solid fa-plus"></i> 分析並加入組合`;
            btn.disabled = false;
        });

        document.getElementById('sim-years-slider').addEventListener('input', updateGrowthSimulation);
        window.onload = function() { updateAllUI(); };
    </script>
</body>
</html>
